<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 - Comfelle</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #111113;
      --border: #27272a;
      --border-focus: #52525b;
      --text: #fafafa;
      --muted: #71717a;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .box {
      width: 100%;
      max-width: 340px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 28px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .mark {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--text);
    }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      height: 38px;
      padding: 0 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.12s ease;
    }
    input:focus { border-color: var(--border-focus); }
    button {
      width: 100%;
      height: 38px;
      margin-top: 8px;
      border: 1px solid var(--text);
      border-radius: 6px;
      background: var(--text);
      color: var(--bg);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.12s ease;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.45; cursor: default; }
    .err {
      display: none;
      margin-top: 12px;
      font-size: 12px;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <form class="box" id="login-form">
    <div class="brand"><span class="mark"></span>Comfelle</div>
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" id="submit-btn">登录</button>
    <div class="err" id="err-box"></div>
  </form>
  <script>
    const form = document.getElementById("login-form");
    const errBox = document.getElementById("err-box");
    const btn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "验证中";
      try {
        const res = await fetch("/panel/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Requested-With": "fetch"
          },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          window.location.href = data.redirect || "/panel";
          return;
        }
        errBox.textContent = data.error || "登录失败";
        errBox.style.display = "block";
      } catch (_) {
        errBox.textContent = "连接失败";
        errBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.textContent = "登录";
      }
    });
  </script>
</body>
</html>
