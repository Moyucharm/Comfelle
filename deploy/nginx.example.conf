# 前置 Nginx HTTPS 反代示例（将公网 TLS 流量转发至本机 Go 网关 127.0.0.1:8080）
# 注意：关闭代理缓冲、支持 WebSocket、调大上传体积与超时，且不记录敏感路径访问日志。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name comfy.example.com;

    ssl_certificate     /etc/letsencrypt/live/comfy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comfy.example.com/privkey.pem;

    access_log off;
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
